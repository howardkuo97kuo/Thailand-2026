# Lets Claude read the live itinerary: the cloud session can't reach Firebase, but GitHub can.
# Dispatch via REST (path input), then read snapshot/<path>.json on the `snapshot` branch
# (job logs live on a blob host the cloud session can't reach). Howard agreed to this branch 10/17.
name: read-firebase
on:
  workflow_dispatch:
    inputs:
      path:
        description: "Firebase path to read (all = plan + hearts + must, or one path)"
        default: "all"
permissions:
  contents: write
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Read
        env:
          P: ${{ inputs.path }}
        run: |
          case "$P" in plan*|hearts*|must*|feedback*|all) ;; *) echo "path not allowed"; exit 1;; esac
          [ "$P" = all ] && LIST="plan hearts must" || LIST="$P"
          git clone -q --branch snapshot --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" s 2>/dev/null || { git init -q s && git -C s checkout -q -b snapshot; }
          for X in $LIST; do
            mkdir -p "$(dirname "s/snapshot/$X")"
            curl -sSf "https://thailand-2026-7304d-default-rtdb.asia-southeast1.firebasedatabase.app/$X.json" -o "s/snapshot/$X.json"
          done
          cd s
          git -c user.name=github-actions -c user.email=actions@github.com add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "snapshot $P" || true
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" snapshot
