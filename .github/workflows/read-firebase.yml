# Lets Claude read the live itinerary: the cloud session can't reach Firebase, but GitHub can.
# Dispatch via REST (path input), then read snapshot/<path>.json on the `snapshot` branch
# (job logs live on a blob host the cloud session can't reach). Howard agreed to this branch 10/17.
name: read-firebase
on:
  workflow_dispatch:
    inputs:
      path:
        description: "Firebase path to read (plan, plan/2026-10-17, hearts, must)"
        default: "plan"
permissions:
  contents: write
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Read
        env:
          P: ${{ inputs.path }}
        run: |
          case "$P" in plan*|hearts*|must*|feedback*) ;; *) echo "path not allowed"; exit 1;; esac
          curl -sSf "https://thailand-2026-7304d-default-rtdb.asia-southeast1.firebasedatabase.app/$P.json" -o out.json
          git init -q s && cd s && git checkout -q -b snapshot
          mkdir -p "$(dirname "snapshot/$P")" && mv ../out.json "snapshot/$P.json"
          git -c user.name=github-actions -c user.email=actions@github.com add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "snapshot $P"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" snapshot
